openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 5S Compliance API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: areas
    description: Area management
  - name: profiles
    description: Per-area learned profiles
  - name: submissions
    description: 5S submissions (image or video)
  - name: dashboard
    description: Manager dashboard
  - name: escalations
    description: Auto-escalations on failed audits
  - name: schedule
    description: Proactive check schedule for operators
  - name: labels
    description: Manager labeling for AI calibration
  - name: model
    description: AI model status
  - name: nudges
    description: In-app reminders from managers to operators
  - name: live
    description: Live shift snapshot for managers
  - name: preferences
    description: Per-user preferences (notifications, etc.)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [areas]
      summary: Create a new area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAreaBody"
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /areas/{id}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update an area name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaBody"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
    delete:
      operationId: deleteArea
      tags: [areas]
      summary: Delete an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Area deleted

  /areas/{id}/profile:
    get:
      operationId: getAreaProfile
      tags: [profiles]
      summary: Get the learned profile for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Area profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"
    put:
      operationId: updateAreaProfile
      tags: [profiles]
      summary: Update the learned profile for an area (manager edit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"
    delete:
      operationId: resetAreaProfile
      tags: [profiles]
      summary: Reset the learned profile for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List submissions with optional filters
      parameters:
        - name: shift
          in: query
          schema:
            type: string
            enum: [A, B, C]
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Free-text search across operator email, machine tag, and area name.
          schema:
            type: string
        - name: minScorePercent
          in: query
          description: Inclusive lower bound on overall score (0-100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: maxScorePercent
          in: query
          description: Inclusive upper bound on overall score (0-100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a 5S video walk-through (preferred) or photo for scoring
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                areaId:
                  type: integer
                media:
                  type: string
                  format: binary
                  description: Video (preferred) or image file. Use this OR `photo`.
                photo:
                  type: string
                  format: binary
                  description: Legacy image-only field (still accepted).
                shift:
                  type: string
                  enum: [A, B, C]
                machineTag:
                  type: string
                  description: Optional sub-area / machine being captured.
              required:
                - areaId
      responses:
        "201":
          description: Submission created with score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/{id}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Get a single submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/{id}/reupload:
    put:
      operationId: reuploadSubmission
      tags: [submissions]
      summary: Re-upload media for an existing submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                photo:
                  type: string
                  format: binary
                shift:
                  type: string
                  enum: [A, B, C]
                machineTag:
                  type: string
      responses:
        "200":
          description: Submission updated and re-scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /dashboard/compliance:
    get:
      operationId: getDashboardCompliance
      tags: [dashboard]
      summary: Get shift compliance percentage
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: shift
          in: query
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Compliance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceData"

  /dashboard/scores:
    get:
      operationId: getDashboardScores
      tags: [dashboard]
      summary: Get average scores by area/shift/day
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [area, shift, day]
      responses:
        "200":
          description: Score summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreSummary"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Quick overview stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/trends:
    get:
      operationId: getDashboardTrends
      tags: [dashboard]
      summary: Per-area daily score trend over the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
        - name: shift
          in: query
          description: Restrict each day's average to submissions from a single shift.
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Trend per area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaTrend"

  /shift/current:
    get:
      operationId: getCurrentShift
      tags: [submissions]
      summary: Get the current shift based on server time
      responses:
        "200":
          description: Current shift info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentShift"

  /operator/status:
    get:
      operationId: getOperatorStatus
      tags: [submissions]
      summary: Get operator submission status for current shift
      parameters:
        - name: shift
          in: query
          required: false
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Status per area for current shift
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaStatus"

  /operator/next-checks:
    get:
      operationId: getNextChecks
      tags: [schedule]
      summary: Proactive feed of areas/machines that need to be checked next
      responses:
        "200":
          description: Ordered next-check list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NextCheck"

  /operator/recent:
    get:
      operationId: getOperatorRecent
      tags: [submissions]
      summary: Operator's most recent submissions across shifts (latest N within a 30-day context window)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Recent submissions for the current operator with prior-score context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentSubmission"

  /escalations:
    get:
      operationId: listEscalations
      tags: [escalations]
      summary: List escalations (manager)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, ACKNOWLEDGED, RESOLVED, ALL]
      responses:
        "200":
          description: Escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Escalation"

  /escalations/count:
    get:
      operationId: getEscalationCount
      tags: [escalations]
      summary: Open escalation count for badges
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationCount"

  /escalations/{id}/acknowledge:
    post:
      operationId: acknowledgeEscalation
      tags: [escalations]
      summary: Manager acknowledges an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /escalations/{id}/resolve:
    post:
      operationId: resolveEscalation
      tags: [escalations]
      summary: Manager resolves an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /labels:
    post:
      operationId: createLabel
      tags: [labels]
      summary: Label a submission with pillar scores (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelBody"
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"

  /labels/quick-approve:
    post:
      operationId: quickApproveLabel
      tags: [labels]
      summary: Approve the AI's score as the manager label in one click
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickApproveLabelBody"
      responses:
        "201":
          description: Label created from AI score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"

  /nudges:
    get:
      operationId: getActiveNudges
      tags: [nudges]
      summary: Operator pulls active nudges (and they are dismissed atomically)
      responses:
        "200":
          description: Active nudges for the calling operator (now dismissed)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"
    post:
      operationId: createNudge
      tags: [nudges]
      summary: Manager records a nudge against an area (and optional machine) for a shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNudgeBody"
      responses:
        "201":
          description: Nudge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nudge"

  /nudges/{id}/dismiss:
    post:
      operationId: dismissNudge
      tags: [nudges]
      summary: Operator dismisses a specific active nudge they have already addressed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nudge dismissed (or already dismissed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nudge"
        "404":
          description: Nudge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nudges/active-by-area:
    get:
      operationId: getActiveNudgesByArea
      tags: [nudges]
      summary: Operator pulls undismissed nudges (without dismissing them) so they can render as persistent badges on area cards
      parameters:
        - in: query
          name: shift
          required: false
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Active (undismissed) nudges, optionally filtered by shift
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"

  /shift/live:
    get:
      operationId: getLiveShift
      tags: [live]
      summary: Single-pane snapshot of the in-progress IST shift for managers
      responses:
        "200":
          description: Live shift snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveShift"

  /labels/{submissionId}:
    get:
      operationId: getLabels
      tags: [labels]
      summary: Get labels for a submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Labels for the submission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"

  /me/notification-preferences:
    get:
      operationId: getMyNotificationPreferences
      tags: [preferences]
      summary: Get the calling user's notification preferences (and provider config status)
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    put:
      operationId: updateMyNotificationPreferences
      tags: [preferences]
      summary: Update the calling user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesBody"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

  /areas/{id}/model-status:
    get:
      operationId: getAreaModelStatus
      tags: [model]
      summary: Get learning status for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [OPERATOR, MANAGER]
      required: [id, email, role]

    NotificationPreferences:
      type: object
      properties:
        notifyEmailEnabled:
          type: boolean
        notifySlackEnabled:
          type: boolean
        emailConfigured:
          type: boolean
          description: True when the server has the keys needed to actually send email.
        slackConfigured:
          type: boolean
          description: True when the server has a Slack webhook configured.
        email:
          type: string
          description: The address email notifications would be sent to (the user's account email).
        quietHoursEnabled:
          type: boolean
          description: When true, notifications are suppressed for this recipient during the configured window.
        quietHoursStart:
          type: string
          description: Quiet-hours window start in IST, 24h "HH:MM" format.
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          description: Quiet-hours window end in IST, 24h "HH:MM" format. May wrap past midnight (end < start).
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursWeekdayMask:
          type: integer
          minimum: 0
          maximum: 127
          description: 7-bit mask of weekdays the window applies to. Bit 0 = Sunday … bit 6 = Saturday. 127 = every day.
      required:
        - notifyEmailEnabled
        - notifySlackEnabled
        - emailConfigured
        - slackConfigured
        - email
        - quietHoursEnabled
        - quietHoursStart
        - quietHoursEnd
        - quietHoursWeekdayMask

    UpdateNotificationPreferencesBody:
      type: object
      properties:
        notifyEmailEnabled:
          type: boolean
        notifySlackEnabled:
          type: boolean
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursWeekdayMask:
          type: integer
          minimum: 0
          maximum: 127

    Area:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required: [id, name]

    CreateAreaBody:
      type: object
      properties:
        name:
          type: string
      required: [name]

    UpdateAreaBody:
      type: object
      properties:
        name:
          type: string
      required: [name]

    AreaProfile:
      type: object
      properties:
        areaId:
          type: integer
        status:
          type: string
          enum: [LEARNING, TRAINED]
        submissionsCount:
          type: integer
        targetSubmissions:
          type: integer
        summary:
          type: string
          nullable: true
        items:
          type: array
          items: { type: string }
        machines:
          type: array
          items: { type: string }
        layout:
          type: array
          items: { type: string }
        commonIssues:
          type: array
          items: { type: string }
        updatedAt:
          type: string
          format: date-time
      required:
        - areaId
        - status
        - submissionsCount
        - targetSubmissions
        - items
        - machines
        - layout
        - commonIssues
        - updatedAt

    UpdateAreaProfileBody:
      type: object
      properties:
        summary:
          type: string
          nullable: true
        items:
          type: array
          items: { type: string }
        machines:
          type: array
          items: { type: string }
        layout:
          type: array
          items: { type: string }
        commonIssues:
          type: array
          items: { type: string }

    Submission:
      type: object
      properties:
        id:
          type: integer
        areaId:
          type: integer
        areaName:
          type: string
        userId:
          type: integer
        userEmail:
          type: string
        shift:
          type: string
          enum: [A, B, C]
        scoreTotal:
          type: integer
        scoreJson:
          type: object
          properties:
            sort: { type: integer }
            set: { type: integer }
            shine: { type: integer }
            standardize: { type: integer }
            sustain: { type: integer }
          required: [sort, set, shine, standardize, sustain]
        suggestionsJson:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        mediaType:
          type: string
          enum: [image, video]
        keyframesJson:
          type: array
          nullable: true
          items:
            type: string
        machineTag:
          type: string
          nullable: true
        failingPillarsJson:
          type: array
          nullable: true
          items:
            type: string
        aiTotalScore:
          type: integer
          nullable: true
        aiPillarsJson:
          type: object
          nullable: true
          properties:
            sort: { type: integer }
            set: { type: integer }
            shine: { type: integer }
            standardize: { type: integer }
            sustain: { type: integer }
        aiRecommendationsJson:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AIRecommendation"
        aiIssuesJson:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/AIIssue"
        scoringMode:
          type: string
          nullable: true
        modelVersion:
          type: string
          nullable: true
        embeddingHash:
          type: string
          nullable: true
        openEscalationId:
          type: integer
          nullable: true
          description: ID of the most-recent OPEN or ACKNOWLEDGED escalation tied to this submission, or null if none. Lets the manager UI offer single-key resolve from the audit log.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - areaId
        - areaName
        - userId
        - shift
        - scoreTotal
        - scoreJson
        - suggestionsJson
        - imageUrl
        - mediaType
        - createdAt

    AIRecommendation:
      type: object
      properties:
        action:
          type: string
        why:
          type: string
        location:
          type: string
        principle:
          type: string
          nullable: true
      required: [action, why, location]

    AIIssue:
      type: object
      properties:
        issue:
          type: string
        evidence:
          type: string
        location:
          type: string
        pillar:
          type: string
          nullable: true
        principle:
          type: string
          nullable: true
      required: [issue, evidence, location]

    CreateLabelBody:
      type: object
      properties:
        submissionId:
          type: integer
        pillarsJson:
          type: object
          properties:
