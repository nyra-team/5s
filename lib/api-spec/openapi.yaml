    Escalation:
      type: object
      properties:
        id:
          type: integer
        submissionId:
          type: integer
        areaId:
          type: integer
        areaName:
          type: string
        operatorId:
          type: integer
        operatorEmail:
          type: string
        scoreTotal:
          type: integer
        scorePercent:
          type: integer
        failingPillars:
          type: array
          items:
            type: string
        recommendedActions:
          type: array
          items:
            type: string
        evidenceUrls:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED, RESOLVED]
        createdAt:
          type: string
          format: date-time
        ackedAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        repingCount:
          type: integer
          description: Number of automated reminder pings sent to managers after the original alert.
        lastRepingAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent reminder ping, if any.
        notifyDeliveryStatus:
          type: string
          nullable: true
          enum: [DELIVERED, SKIPPED_RECOVERY_WINDOW, NO_PROVIDER_CONFIGURED]
          description: |
            Outcome of the most recent notification dispatch attempt for this
            escalation. `DELIVERED` means the API made a best-effort send to
            the configured email/Slack providers (individual provider failures
            are logged but still counted as delivered). `SKIPPED_RECOVERY_WINDOW`
            means the startup-recovery sweep found this row older than the
            recovery window and gave up on dispatching it — managers see a
            "delivery skipped" badge so they know the alert never went out.
            `NO_PROVIDER_CONFIGURED` means dispatch ran but no notification
            channel could carry the alert: either neither Slack nor Resend is
            configured at all, or every targeted manager only had channels
            enabled whose providers are missing — managers see a distinct
            "No channel configured" badge so they know the alert never left
            the system.
            `null` when no dispatch has happened yet.
      required:
        - id
        - submissionId
        - areaId
        - areaName
        - operatorId
        - operatorEmail
        - scoreTotal
        - scorePercent
        - failingPillars
        - recommendedActions
        - evidenceUrls
        - status
        - createdAt
        - repingCount

    EscalationCount:
      type: object
      properties:
        open:
          type: integer
      required: [open]

    NextCheck:
      type: object
      properties:
        areaId:
          type: integer
        areaName:
          type: string
        machine:
          type: string
          nullable: true
        lastCheckAt:
          type: string
          format: date-time
          nullable: true
        nextDueAt:
          type: string
          format: date-time
        cadenceSeconds:
          type: integer
        overdue:
          type: boolean
        reason:
          type: string
      required:
        - areaId
        - areaName
        - nextDueAt
        - cadenceSeconds
        - overdue
        - reason

    RecentSubmission:
      type: object
      description: A trimmed view of the operator's own submission with prior-score context for trend rendering.
      properties:
        id:
          type: integer
        areaId:
          type: integer
        areaName:
          type: string
        shift:
          type: string
          enum: [A, B, C]
        scoreTotal:
          type: integer
        mediaType:
          type: string
          enum: [image, video]
        machineTag:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        prevScoreTotal:
          type: integer
          nullable: true
          description: The operator's own previous scoreTotal for this area (any time before this one), or null if none.
        bestScoreInLastWeek:
          type: integer
          nullable: true
          description: The operator's max scoreTotal for this area in the 7 days strictly preceding this submission's createdAt (excluding the submission itself). Null if there were no prior submissions in that window.
        topActions:
          type: array
          items:
            type: string
          description: Up to 2 short action labels (taken from the submission's suggestionsJson) so the operator can preview outstanding actions inline without opening the detail dialog. Always present; empty when the submission has no suggestions.
        scoringMode:
          type: string
          nullable: true
          description: How the submission was scored. "VLM_RUBRIC" / "VLM_KEYFRAMES_RUBRIC" mean the AI graded it normally; "FALLBACK" means scoring failed and the saved score is meaningless — the operator's recent strip surfaces this as "Couldn't be scored" so they don't mistake the fallback for a real 0%.
      required:
        - id
        - areaId
        - areaName
        - shift
        - scoreTotal
        - mediaType
        - createdAt
        - topActions

    QuickApproveLabelBody:
      type: object
      properties:
        submissionId:
          type: integer
      required: [submissionId]

    CreateNudgeBody:
      type: object
      properties:
        areaId:
          type: integer
        machine:
          type: string
          nullable: true
        shift:
          type: string
          enum: [A, B, C]
        message:
          type: string
          nullable: true
      required: [areaId, shift]

    Nudge:
      type: object
      properties:
        id:
          type: integer
        areaId:
          type: integer
        areaName:
          type: string
        machine:
          type: string
          nullable: true
        shift:
          type: string
          enum: [A, B, C]
        message:
          type: string
          nullable: true
        createdByEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        dismissedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - areaId
        - areaName
        - shift
        - createdByEmail
        - createdAt

    LiveShiftPendingArea:
      type: object
      properties:
        areaId:
          type: integer
        areaName:
          type: string
        lastNudgeAt:
          type: string
          format: date-time
          nullable: true
        lastOperatorDismissedNudgeAt:
          type: string
          format: date-time
          nullable: true
          description: When the operator most recently dismissed a nudge for this area in the current shift without submitting fresh evidence. Null if no such dismissal occurred.
        lastOperatorDismissedNudgeByEmail:
          type: string
          nullable: true
          description: Email of the operator who performed the most recent operator-dismiss for this area in the current shift, paired with `lastOperatorDismissedNudgeAt`. Null if unknown or no such dismissal occurred.
      required: [areaId, areaName]

    LiveShiftOverdueCheck:
      type: object
      properties:
        areaId:
          type: integer
        areaName:
          type: string
        machine:
          type: string
          nullable: true
        overdueSinceMinutes:
          type: integer
        cadenceSeconds:
          type: integer
        lastNudgeAt:
          type: string
          format: date-time
          nullable: true
        lastOperatorDismissedNudgeAt:
          type: string
          format: date-time
          nullable: true
          description: When the operator most recently dismissed a nudge for this area+machine in the current shift without submitting fresh evidence. Null if no such dismissal occurred.
        lastOperatorDismissedNudgeByEmail:
          type: string
          nullable: true
          description: Email of the operator who performed the most recent operator-dismiss for this area+machine in the current shift, paired with `lastOperatorDismissedNudgeAt`. Null if unknown or no such dismissal occurred.
      required: [areaId, areaName, overdueSinceMinutes, cadenceSeconds]

    LiveShiftLowScoring:
      type: object
      properties:
        submissionId:
          type: integer
        areaId:
          type: integer
        areaName:
          type: string
        operatorEmail:
          type: string
        scorePercent:
          type: integer
        createdAt:
          type: string
          format: date-time
        thumbnailUrl:
          type: string
        hasOpenEscalation:
          type: boolean
      required:
        - submissionId
        - areaId
        - areaName
        - operatorEmail
        - scorePercent
        - createdAt
        - thumbnailUrl
        - hasOpenEscalation

    LiveShift:
      type: object
      properties:
