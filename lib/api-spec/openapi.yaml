        "404":
          description: Area not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/backfill-reasoning:
    get:
      operationId: getBackfillReasoningStatus
      tags: [admin]
      summary: How many legacy submissions still need their AI reasoning backfilled
      responses:
        "200":
          description: Outstanding backfill count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillReasoningStatus"
    post:
      operationId: backfillReasoning
      tags: [admin]
      summary: Re-run the VLM against legacy submissions and persist their per-pillar reasoning (manager only)
      parameters:
        - name: limit
          in: query
          required: false
          description: Max submissions to process this call (default 25, cap 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: submissionId
          in: query
          required: false
          description: Process only this one submission (overrides limit)
          schema:
            type: integer
            minimum: 1
        - name: dryRun
          in: query
          required: false
          description: Report what would change without touching the DB or hitting the VLM
          schema:
            type: string
      responses:
        "200":
          description: Per-row outcomes plus updated outstanding count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackfillReasoningResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      description: |-
        Standard error envelope returned by 4xx/5xx responses across the API.

        The `error` field is always present (a short developer-readable
        summary). The optional `code`, `hint`, and `retryable` fields make up
        the structured envelope attached by endpoints that want to give
        callers something more actionable than a free-form string:

        - `code` — stable machine-readable identifier so a client can branch
          on the failure mode (e.g. show a connection toast vs. a "fix your
          capture" toast).
        - `hint` — short user-facing sentence describing what to try next.
        - `retryable` — true when retrying the same request without further
          user input is expected to succeed (typically transient
          infrastructure failures).

        Clients should treat unknown `code` values as opaque and fall back to
        `hint` (if present) or `error`.
      properties:
        error:
          type: string
          description: Short developer-readable summary of the failure.
        code:
          type: string
          description: |-
            Stable machine-readable identifier for the failure mode. Known
            values emitted today include `SCORING_FAILED`, `MEDIA_REQUIRED`,
            `AREA_REQUIRED`, `AREA_NOT_FOUND`, `SUBMISSION_NOT_FOUND`,
            `FORBIDDEN`, and `INVALID_ID`. New codes may be added over time;
            unknown codes should be treated as opaque.
        hint:
          type: string
          description: |-
            User-facing actionable hint describing what the operator (or
            caller) should try next. Safe to surface verbatim in UI.
        retryable:
          type: boolean
          description: |-
            True when the same request is worth retrying without further
            user input — typically a transient infrastructure failure such
            as the AI scoring pipeline timing out. Absent when not
            specified by the endpoint.
      required: [error]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [OPERATOR, MANAGER]
      required: [id, email, role]

    NotificationPreferences:
      type: object
      properties:
        notifyEmailEnabled:
          type: boolean
        notifySlackEnabled:
          type: boolean
        emailConfigured:
          type: boolean
          description: True when the server has the keys needed to actually send email.
        slackConfigured:
          type: boolean
          description: True when the server has a Slack webhook configured.
        email:
          type: string
          description: The address email notifications would be sent to (the user's account email).
        quietHoursEnabled:
          type: boolean
          description: When true, notifications are suppressed for this recipient during the configured window.
        quietHoursStart:
          type: string
          description: Quiet-hours window start in IST, 24h "HH:MM" format.
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          description: Quiet-hours window end in IST, 24h "HH:MM" format. May wrap past midnight (end < start).
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursWeekdayMask:
          type: integer
          minimum: 0
          maximum: 127
          description: 7-bit mask of weekdays the window applies to. Bit 0 = Sunday … bit 6 = Saturday. 127 = every day.
        quietHoursActive:
          type: boolean
          description: True when the user's quiet-hours window is currently muting their alerts.
        quietHoursActiveUntil:
          type: string
          format: date-time
          nullable: true
          description: When `quietHoursActive` is true, the absolute moment the current window ends. Null otherwise.
        quietHoursNextStart:
          type: string
          format: date-time
          nullable: true
          description: When `quietHoursActive` is false, the absolute moment the next quiet-hours window begins. Null when quiet hours are off or the weekday mask is empty.
      required:
        - notifyEmailEnabled
        - notifySlackEnabled
        - emailConfigured
        - slackConfigured
        - email
        - quietHoursEnabled
        - quietHoursStart
        - quietHoursEnd
        - quietHoursWeekdayMask
        - quietHoursActive
        - quietHoursActiveUntil
        - quietHoursNextStart

    UpdateNotificationPreferencesBody:
      type: object
      properties:
        notifyEmailEnabled:
          type: boolean
        notifySlackEnabled:
          type: boolean
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursWeekdayMask:
          type: integer
          minimum: 0
          maximum: 127

    OperatorThresholdSources:
      type: object
      description: Per-field override values (null when no override is set at this layer).
      properties:
        encouragementMinPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        priorBestWindowDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
        dueSoonThresholdMinutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1440
      required:
        - encouragementMinPercent
        - priorBestWindowDays
        - dueSoonThresholdMinutes

    FacilitySettings:
      type: object
      description: |
        Effective facility shift schedule (env > DB > default), plus the
        per-layer overrides so the manager UI can show provenance.
      properties:
        timeZone:
          type: string
          description: IANA timezone the shift clock is anchored to.
        shiftAStartHour:
          type: integer
          minimum: 0
          maximum: 23
        shiftBStartHour:
          type: integer
          minimum: 0
          maximum: 23
        shiftCStartHour:
          type: integer
          minimum: 0
          maximum: 23
        defaults:
          type: object
          description: Static fallback values shipped with the build.
          properties:
            timeZone:
              type: string
            shiftAStartHour:
              type: integer
            shiftBStartHour:
              type: integer
            shiftCStartHour:
              type: integer
          required:
            - timeZone
            - shiftAStartHour
            - shiftBStartHour
            - shiftCStartHour
        envOverrides:
          $ref: "#/components/schemas/FacilitySettingsSources"
        dbOverrides:
          $ref: "#/components/schemas/FacilitySettingsSources"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the DB override row was last touched.
        updatedByUserId:
          type: integer
          nullable: true
          description: Manager who last touched the DB override row.
      required:
        - timeZone
        - shiftAStartHour
        - shiftBStartHour
        - shiftCStartHour
        - defaults
        - envOverrides
        - dbOverrides

    FacilitySettingsSources:
      type: object
      properties:
        timeZone:
          type: string
          nullable: true
        shiftAStartHour:
          type: integer
          nullable: true
        shiftBStartHour:
          type: integer
          nullable: true
        shiftCStartHour:
          type: integer
          nullable: true

    UpdateFacilitySettingsBody:
      type: object
      description: |
        Patch for the DB-backed facility settings row. Per-field semantics:
        omitted = leave existing value, null = clear the override
        (fall back to env/default), value = set the override.
      properties:
        timeZone:
          type: string
          nullable: true
          description: IANA timezone string (e.g. "Asia/Kolkata").
        shiftAStartHour:
          type: integer
          nullable: true
          minimum: 0
          maximum: 23
        shiftBStartHour:
          type: integer
          nullable: true
          minimum: 0
          maximum: 23
        shiftCStartHour:
          type: integer
          nullable: true
          minimum: 0
          maximum: 23

    OperatorThresholds:
      type: object
      description: |
        Effective operator-facing thresholds (env > DB > default), plus the
        per-layer overrides so the admin UI can show provenance.
      properties:
        encouragementMinPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Display percent at which a submission is considered "good".
        priorBestWindowDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Lookback window (days) for prior-best per area.
        dueSoonThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: Time-to-due (minutes) at which an area check is "due soon".
        defaults:
          type: object
          description: Static fallback values shipped with the build.
          properties:
            encouragementMinPercent:
              type: integer
            priorBestWindowDays:
              type: integer
            dueSoonThresholdMinutes:
              type: integer
          required:
            - encouragementMinPercent
            - priorBestWindowDays
            - dueSoonThresholdMinutes
        envOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
        dbOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the DB override row was last touched.
        updatedByUserId:
          type: integer
          nullable: true
          description: Manager who last touched the DB override row.
        updatedByUserEmail:
          type: string
          nullable: true
          description: |
            Email of the manager who last touched the DB override row.
            Resolved server-side so the admin UI can show "last changed
            by Alice" without a second round-trip.
        auditHistory:
          type: array
          description: |
            Most recent per-field changes (newest first), capped at 5.
            Each entry corresponds to a single field changed in a single
            PUT — a manager who tweaks two dials at once produces two
            entries with the same `changedAt` timestamp.
          items:
            $ref: "#/components/schemas/OperatorThresholdAuditEntry"
        areaOverrides:
          type: array
          description: |
            Every per-area override row (joined with the area name) so the
            admin UI can render a per-area selector with provenance markers
            without a second round-trip. Areas with no override row are
            absent.
          items:
            $ref: "#/components/schemas/AreaOperatorThresholdEntry"
      required:
        - encouragementMinPercent
        - priorBestWindowDays
        - dueSoonThresholdMinutes
        - defaults
        - envOverrides
        - dbOverrides
        - auditHistory
        - areaOverrides

    OperatorThresholdAuditEntry:
      type: object
      properties:
        id:
          type: integer
        changedAt:
          type: string
          format: date-time
        changedByUserId:
          type: integer
          nullable: true
          description: |
            Manager who made the change. Goes null if that user is later
            deleted (the FK uses ON DELETE SET NULL so the rest of the
            audit row — what moved, when, from/to — is preserved).
        changedByUserEmail:
          type: string
          nullable: true
          description: Resolved at read time; null if the user was deleted.
        field:
          type: string
          description: |
            The threshold key that moved. One of:
            encouragementMinPercent, priorBestWindowDays,
            dueSoonThresholdMinutes.
        oldValue:
          type: integer
          nullable: true
          description: Previous DB override (null = no override / fell back to env or default).
        newValue:
          type: integer
          nullable: true
          description: New DB override (null = override cleared).
      required:
        - id
        - changedAt
        - field

    AreaOperatorThresholdEntry:
      type: object
      description: |
        One per-area override row plus the resolved area name. Threshold
        fields are nullable because each layer can selectively override
        a subset of fields (the others fall through to global / env /
        default).
      properties:
        areaId:
          type: integer
        areaName:
          type: string
        encouragementMinPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        priorBestWindowDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
        dueSoonThresholdMinutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1440
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedByUserId:
          type: integer
          nullable: true
      required:
        - areaId
        - areaName
        - encouragementMinPercent
        - priorBestWindowDays
        - dueSoonThresholdMinutes

    AreaOperatorThresholds:
      type: object
      description: |
        Effective per-area operator thresholds (env > area-DB > global-DB >
        default) plus every layer's source values so the admin UI can show
        provenance per field.
      properties:
        areaId:
          type: integer
        areaName:
          type: string
        encouragementMinPercent:
          type: integer
          minimum: 0
          maximum: 100
        priorBestWindowDays:
          type: integer
          minimum: 1
          maximum: 365
        dueSoonThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        defaults:
          type: object
          properties:
            encouragementMinPercent:
              type: integer
            priorBestWindowDays:
              type: integer
            dueSoonThresholdMinutes:
              type: integer
          required:
            - encouragementMinPercent
            - priorBestWindowDays
            - dueSoonThresholdMinutes
        envOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
        globalOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
          description: Global DB override values (the layer that applies when no area override is set).
        areaOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
          description: This area's per-area DB override row (all-nulls when the area has no row yet).
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When this area's per-area override row was last touched.
        updatedByUserId:
          type: integer
          nullable: true
      required:
        - areaId
        - areaName
        - encouragementMinPercent
        - priorBestWindowDays
        - dueSoonThresholdMinutes
        - defaults
        - envOverrides
        - globalOverrides
        - areaOverrides

    UpdateOperatorThresholdsBody:
      type: object
      description: |
        Patch for the DB-backed override row. Per-field semantics:
        omitted = leave existing value, null = clear the override
        (fall back to env/default), integer = set the override.
      properties:
        encouragementMinPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        priorBestWindowDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
        dueSoonThresholdMinutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1440

    Area:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        environmentType:
          type: string
          enum: [factory, warehouse, home, corporate_office]
          description: The kind of physical setting this area represents. Drives the AI rubric used to score submissions.
      required: [id, name, environmentType]

    CreateAreaBody:
      type: object
      properties:
        name:
          type: string
        environmentType:
          type: string
          enum: [factory, warehouse, home, corporate_office]
          description: Optional. Defaults to "factory".
      required: [name]

    UpdateAreaBody:
      type: object
      properties:
        name:
          type: string
        environmentType:
