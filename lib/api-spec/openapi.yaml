        "200":
          description: Model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatus"

  /facility-settings:
    get:
      operationId: getFacilitySettings
      tags: [settings]
      summary: Get the effective facility shift schedule (with override provenance)
      responses:
