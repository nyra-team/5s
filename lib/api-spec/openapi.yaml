          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAreaOperatorThresholds
      tags: [settings]
      summary: Update the per-area DB override row (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperatorThresholdsBody"
      responses:
        "200":
          description: Effective thresholds for the area after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaOperatorThresholds"
        "404":
          description: Area not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearAreaOperatorThresholds
      tags: [settings]
      summary: Clear every per-area override for an area in one shot (manager only)
      parameters:
