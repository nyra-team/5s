openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 5S Compliance API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: areas
    description: Area management
  - name: profiles
    description: Per-area learned profiles
  - name: submissions
    description: 5S submissions (image or video)
  - name: dashboard
    description: Manager dashboard
  - name: escalations
    description: Auto-escalations on failed audits
  - name: schedule
    description: Proactive check schedule for operators
  - name: labels
    description: Manager labeling for AI calibration
  - name: model
    description: AI model status
  - name: nudges
    description: In-app reminders from managers to operators
  - name: live
    description: Live shift snapshot for managers
  - name: preferences
    description: Per-user preferences (notifications, etc.)
  - name: settings
    description: Admin-tunable settings (operator thresholds, etc.)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [areas]
      summary: Create a new area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAreaBody"
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /areas/{id}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update an area name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaBody"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
    delete:
      operationId: deleteArea
      tags: [areas]
      summary: Delete an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Area deleted

  /areas/{id}/profile:
    get:
      operationId: getAreaProfile
      tags: [profiles]
      summary: Get the learned profile for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Area profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"
    put:
      operationId: updateAreaProfile
      tags: [profiles]
      summary: Update the learned profile for an area (manager edit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"
    delete:
      operationId: resetAreaProfile
      tags: [profiles]
      summary: Reset the learned profile for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List submissions with optional filters
      parameters:
        - name: shift
          in: query
          schema:
            type: string
            enum: [A, B, C]
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Free-text search across operator email, machine tag, and area name.
          schema:
            type: string
        - name: minScorePercent
          in: query
          description: Inclusive lower bound on overall score (0-100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: maxScorePercent
          in: query
          description: Inclusive upper bound on overall score (0-100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a 5S video walk-through (preferred) or photo for scoring
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                areaId:
                  type: integer
                media:
                  type: string
                  format: binary
                  description: Video (preferred) or image file. Use this OR `photo`.
                photo:
                  type: string
                  format: binary
                  description: Legacy image-only field (still accepted).
                shift:
                  type: string
                  enum: [A, B, C]
                machineTag:
                  type: string
                  description: Optional sub-area / machine being captured.
              required:
                - areaId
      responses:
        "201":
          description: Submission created with score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/identify-area:
    post:
      operationId: identifySubmissionArea
      tags: [submissions]
      summary: Identify which of the operator's trained areas the submitted media most likely shows
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                  description: Video (preferred) or image file. Use this OR `photo`.
                photo:
                  type: string
                  format: binary
                  description: Legacy image-only field (still accepted).
      responses:
        "200":
          description: Ranked candidate areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaIdentificationResult"

  /submissions/{id}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Get a single submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/{id}/reupload:
    put:
      operationId: reuploadSubmission
      tags: [submissions]
      summary: Re-upload media for an existing submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                photo:
                  type: string
                  format: binary
                shift:
                  type: string
                  enum: [A, B, C]
                machineTag:
                  type: string
      responses:
        "200":
          description: Submission updated and re-scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /dashboard/compliance:
    get:
      operationId: getDashboardCompliance
      tags: [dashboard]
      summary: Get shift compliance percentage
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: shift
          in: query
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Compliance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceData"

  /dashboard/scores:
    get:
      operationId: getDashboardScores
      tags: [dashboard]
      summary: Get average scores by area/shift/day
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [area, shift, day]
      responses:
        "200":
          description: Score summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreSummary"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Quick overview stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/trends:
    get:
      operationId: getDashboardTrends
      tags: [dashboard]
      summary: Per-area daily score trend over the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
        - name: shift
          in: query
          description: Restrict each day's average to submissions from a single shift.
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Trend per area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaTrend"

  /shift/current:
    get:
      operationId: getCurrentShift
      tags: [submissions]
      summary: Get the current shift based on server time
      responses:
        "200":
          description: Current shift info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentShift"

  /operator/status:
    get:
      operationId: getOperatorStatus
      tags: [submissions]
      summary: Get operator submission status for current shift
      parameters:
        - name: shift
          in: query
          required: false
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Status per area for current shift
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaStatus"

  /operator/next-checks:
    get:
      operationId: getNextChecks
      tags: [schedule]
      summary: Proactive feed of areas/machines that need to be checked next
      responses:
        "200":
          description: Ordered next-check list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NextCheck"

  /operator/recent:
    get:
      operationId: getOperatorRecent
      tags: [submissions]
      summary: Operator's most recent submissions across shifts (latest N within a 30-day context window)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Recent submissions for the current operator with prior-score context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentSubmission"

  /escalations:
    get:
      operationId: listEscalations
      tags: [escalations]
      summary: List escalations (manager)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, ACKNOWLEDGED, RESOLVED, ALL]
      responses:
        "200":
          description: Escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Escalation"

  /escalations/count:
    get:
      operationId: getEscalationCount
      tags: [escalations]
      summary: Open escalation count for badges
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationCount"

  /escalations/{id}/acknowledge:
    post:
      operationId: acknowledgeEscalation
      tags: [escalations]
      summary: Manager acknowledges an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /escalations/{id}/resolve:
    post:
      operationId: resolveEscalation
      tags: [escalations]
      summary: Manager resolves an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /labels:
    post:
      operationId: createLabel
      tags: [labels]
      summary: Label a submission with pillar scores (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabelBody"
      responses:
        "201":
          description: Label created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"

  /labels/quick-approve:
    post:
      operationId: quickApproveLabel
      tags: [labels]
      summary: Approve the AI's score as the manager label in one click
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickApproveLabelBody"
      responses:
        "201":
          description: Label created from AI score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"

  /nudges:
    get:
      operationId: getActiveNudges
      tags: [nudges]
      summary: Operator pulls active nudges (and they are dismissed atomically)
      responses:
        "200":
          description: Active nudges for the calling operator (now dismissed)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"
    post:
      operationId: createNudge
      tags: [nudges]
      summary: Manager records a nudge against an area (and optional machine) for a shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNudgeBody"
      responses:
        "201":
          description: Nudge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nudge"

  /nudges/{id}/dismiss:
    post:
      operationId: dismissNudge
      tags: [nudges]
      summary: Operator dismisses a specific active nudge they have already addressed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nudge dismissed (or already dismissed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nudge"
        "404":
          description: Nudge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nudges/active-by-area:
    get:
      operationId: getActiveNudgesByArea
      tags: [nudges]
      summary: Operator pulls undismissed nudges (without dismissing them) so they can render as persistent badges on area cards
      parameters:
        - in: query
          name: shift
          required: false
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Active (undismissed) nudges, optionally filtered by shift
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nudge"

  /shift/live:
    get:
      operationId: getLiveShift
      tags: [live]
      summary: Single-pane snapshot of the in-progress IST shift for managers
      responses:
        "200":
          description: Live shift snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveShift"

  /labels/{submissionId}:
    get:
      operationId: getLabels
      tags: [labels]
      summary: Get labels for a submission
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Labels for the submission
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Label"

  /me/notification-preferences:
    get:
      operationId: getMyNotificationPreferences
      tags: [preferences]
      summary: Get the calling user's notification preferences (and provider config status)
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
    put:
      operationId: updateMyNotificationPreferences
      tags: [preferences]
      summary: Update the calling user's notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesBody"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

  /areas/{id}/model-status:
    get:
      operationId: getAreaModelStatus
      tags: [model]
      summary: Get learning status for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatus"

  /operator-thresholds:
    get:
      operationId: getOperatorThresholds
      tags: [settings]
      summary: Get the effective operator thresholds (with override provenance)
      responses:
        "200":
          description: Effective thresholds + sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorThresholds"
    put:
      operationId: updateOperatorThresholds
      tags: [settings]
      summary: Update DB-backed operator threshold overrides (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOperatorThresholdsBody"
      responses:
        "200":
          description: Effective thresholds after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorThresholds"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [OPERATOR, MANAGER]
      required: [id, email, role]

    NotificationPreferences:
      type: object
      properties:
        notifyEmailEnabled:
          type: boolean
        notifySlackEnabled:
          type: boolean
        emailConfigured:
          type: boolean
          description: True when the server has the keys needed to actually send email.
        slackConfigured:
          type: boolean
          description: True when the server has a Slack webhook configured.
        email:
          type: string
          description: The address email notifications would be sent to (the user's account email).
        quietHoursEnabled:
          type: boolean
          description: When true, notifications are suppressed for this recipient during the configured window.
        quietHoursStart:
          type: string
          description: Quiet-hours window start in IST, 24h "HH:MM" format.
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          description: Quiet-hours window end in IST, 24h "HH:MM" format. May wrap past midnight (end < start).
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursWeekdayMask:
          type: integer
          minimum: 0
          maximum: 127
          description: 7-bit mask of weekdays the window applies to. Bit 0 = Sunday … bit 6 = Saturday. 127 = every day.
        quietHoursActive:
          type: boolean
          description: True when the user's quiet-hours window is currently muting their alerts.
        quietHoursActiveUntil:
          type: string
          format: date-time
          nullable: true
          description: When `quietHoursActive` is true, the absolute moment the current window ends. Null otherwise.
        quietHoursNextStart:
          type: string
          format: date-time
          nullable: true
          description: When `quietHoursActive` is false, the absolute moment the next quiet-hours window begins. Null when quiet hours are off or the weekday mask is empty.
      required:
        - notifyEmailEnabled
        - notifySlackEnabled
        - emailConfigured
        - slackConfigured
        - email
        - quietHoursEnabled
        - quietHoursStart
        - quietHoursEnd
        - quietHoursWeekdayMask
        - quietHoursActive
        - quietHoursActiveUntil
        - quietHoursNextStart

    UpdateNotificationPreferencesBody:
      type: object
      properties:
        notifyEmailEnabled:
          type: boolean
        notifySlackEnabled:
          type: boolean
        quietHoursEnabled:
          type: boolean
        quietHoursStart:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursEnd:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        quietHoursWeekdayMask:
          type: integer
          minimum: 0
          maximum: 127

    OperatorThresholdSources:
      type: object
      description: Per-field override values (null when no override is set at this layer).
      properties:
        encouragementMinPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        priorBestWindowDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
        dueSoonThresholdMinutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1440
      required:
        - encouragementMinPercent
        - priorBestWindowDays
        - dueSoonThresholdMinutes

    OperatorThresholds:
      type: object
      description: |
        Effective operator-facing thresholds (env > DB > default), plus the
        per-layer overrides so the admin UI can show provenance.
      properties:
        encouragementMinPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Display percent at which a submission is considered "good".
        priorBestWindowDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Lookback window (days) for prior-best per area.
        dueSoonThresholdMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: Time-to-due (minutes) at which an area check is "due soon".
        defaults:
          type: object
          description: Static fallback values shipped with the build.
          properties:
            encouragementMinPercent:
              type: integer
            priorBestWindowDays:
              type: integer
            dueSoonThresholdMinutes:
              type: integer
          required:
            - encouragementMinPercent
            - priorBestWindowDays
            - dueSoonThresholdMinutes
        envOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
        dbOverrides:
          $ref: "#/components/schemas/OperatorThresholdSources"
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the DB override row was last touched.
        updatedByUserId:
          type: integer
          nullable: true
          description: Manager who last touched the DB override row.
        updatedByUserEmail:
          type: string
          nullable: true
          description: |
            Email of the manager who last touched the DB override row.
            Resolved server-side so the admin UI can show "last changed
            by Alice" without a second round-trip.
        auditHistory:
          type: array
          description: |
            Most recent per-field changes (newest first), capped at 5.
            Each entry corresponds to a single field changed in a single
            PUT — a manager who tweaks two dials at once produces two
            entries with the same `changedAt` timestamp.
          items:
            $ref: "#/components/schemas/OperatorThresholdAuditEntry"
      required:
        - encouragementMinPercent
        - priorBestWindowDays
        - dueSoonThresholdMinutes
        - defaults
        - envOverrides
        - dbOverrides
        - auditHistory

    OperatorThresholdAuditEntry:
      type: object
      properties:
        id:
          type: integer
        changedAt:
          type: string
          format: date-time
        changedByUserId:
          type: integer
          nullable: true
          description: |
            Manager who made the change. Goes null if that user is later
            deleted (the FK uses ON DELETE SET NULL so the rest of the
            audit row — what moved, when, from/to — is preserved).
        changedByUserEmail:
          type: string
          nullable: true
          description: Resolved at read time; null if the user was deleted.
        field:
          type: string
          description: |
            The threshold key that moved. One of:
            encouragementMinPercent, priorBestWindowDays,
            dueSoonThresholdMinutes.
        oldValue:
          type: integer
          nullable: true
          description: Previous DB override (null = no override / fell back to env or default).
        newValue:
          type: integer
          nullable: true
          description: New DB override (null = override cleared).
      required:
        - id
        - changedAt
        - field

    UpdateOperatorThresholdsBody:
      type: object
      description: |
        Patch for the DB-backed override row. Per-field semantics:
        omitted = leave existing value, null = clear the override
        (fall back to env/default), integer = set the override.
      properties:
        encouragementMinPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        priorBestWindowDays:
          type: integer
          nullable: true
          minimum: 1
          maximum: 365
        dueSoonThresholdMinutes:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1440

