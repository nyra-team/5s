openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 5S Compliance API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: areas
    description: Area management
  - name: profiles
    description: Per-area learned profiles
  - name: submissions
    description: 5S submissions (image or video)
  - name: dashboard
    description: Manager dashboard
  - name: escalations
    description: Auto-escalations on failed audits
  - name: schedule
    description: Proactive check schedule for operators
  - name: labels
    description: Manager labeling for AI calibration
  - name: model
    description: AI model status
  - name: nudges
    description: In-app reminders from managers to operators
  - name: live
    description: Live shift snapshot for managers
  - name: preferences
    description: Per-user preferences (notifications, etc.)
  - name: settings
    description: Admin-tunable settings (operator thresholds, etc.)
  - name: users
    description: User directory (manager-only)
  - name: assignments
    description: Operator → area assignments
  - name: admin
    description: Manager-only maintenance endpoints (backfills, etc.)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /areas:
    get:
      operationId: listAreas
      tags: [areas]
      summary: List all areas
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Area"
    post:
      operationId: createArea
      tags: [areas]
      summary: Create a new area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAreaBody"
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"

  /areas/{id}:
    patch:
      operationId: updateArea
      tags: [areas]
      summary: Update an area name
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaBody"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Area"
    delete:
      operationId: deleteArea
      tags: [areas]
      summary: Delete an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Area deleted

  /areas/{id}/assignments:
    get:
      operationId: getAreaAssignments
      tags: [assignments]
      summary: List operator IDs assigned to an area (manager-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assigned operators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaAssignmentList"
    put:
      operationId: setAreaAssignments
      tags: [assignments]
      summary: Replace the set of operators assigned to an area (manager-only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAreaAssignmentsBody"
      responses:
        "200":
          description: Assignments updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaAssignmentList"

  /users/operators:
    get:
      operationId: listOperators
      tags: [users]
      summary: List operator users (manager-only) for the assignment picker
      responses:
        "200":
          description: Operator directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorUser"

  /users/{userId}/assignments:
    get:
      operationId: getUserAreaAssignments
      tags: [assignments]
      summary: List area IDs an operator is assigned to (manager-only). Used by the by-operator bulk picker.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Areas assigned to the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAreaAssignmentList"
    put:
      operationId: setUserAreaAssignments
      tags: [assignments]
      summary: Replace the set of areas an operator is assigned to (manager-only). Empty list clears all assignments and reverts the operator to the "sees everything" backward-compat default.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserAreaAssignmentsBody"
      responses:
        "200":
          description: Assignments updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAreaAssignmentList"

  /areas/{id}/profile:
    get:
      operationId: getAreaProfile
      tags: [profiles]
      summary: Get the learned profile for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Area profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"
    put:
      operationId: updateAreaProfile
      tags: [profiles]
      summary: Update the learned profile for an area (manager edit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAreaProfileBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"
    delete:
      operationId: resetAreaProfile
      tags: [profiles]
      summary: Reset the learned profile for an area
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaProfile"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List submissions with optional filters
      parameters:
        - name: shift
          in: query
          schema:
            type: string
            enum: [A, B, C]
        - name: areaId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Free-text search across operator email, machine tag, and area name.
          schema:
            type: string
        - name: minScorePercent
          in: query
          description: Inclusive lower bound on overall score (0-100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: maxScorePercent
          in: query
          description: Inclusive upper bound on overall score (0-100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: List of submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit a 5S video walk-through (preferred) or photo for scoring
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                areaId:
                  type: integer
                  description: The area the submission is being saved against (auto-detected, manually overridden, or simply the tapped area).
                tappedAreaId:
                  type: integer
                  description: The area the operator originally tapped on the home screen, before auto-detect or a manual override. Recorded so we can analyze drift when it differs from `areaId`.
                aiSuggestedAreaId:
                  type: integer
                  description: Top auto-detect candidate at submission time, when one was available. Used to log corrections (operator overrode the AI's suggestion) for future profile-prompt tuning.
                media:
                  type: string
                  format: binary
                  description: Video (preferred) or image file. Use this OR `photo`.
                photo:
                  type: string
                  format: binary
                  description: Legacy image-only field (still accepted).
                shift:
                  type: string
                  enum: [A, B, C]
                machineTag:
                  type: string
                  description: Optional sub-area / machine being captured.
              required:
                - areaId
      responses:
        "201":
          description: Submission created with score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: |-
            Bad request. Returned when the form is missing a required field.
            Known `code` values: `AREA_REQUIRED`, `MEDIA_REQUIRED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |-
            The operator is not assigned to the requested area. The
            structured `code` field is not currently populated on this
            path (only `error` is sent), so clients should branch on
            HTTP status here rather than `code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |-
            The requested area does not exist. Known `code` values:
            `AREA_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: |-
            The scoring pipeline failed (e.g. AI scorer or media decoder
            errored). Known `code` values: `SCORING_FAILED`. `retryable` is
            set to `true` so callers can offer a retry without re-prompting
            the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /submissions/identify-area:
    post:
      operationId: identifySubmissionArea
      tags: [submissions]
      summary: Identify which of the operator's trained areas the submitted media most likely shows
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                  description: Video (preferred) or image file. Use this OR `photo`.
                photo:
                  type: string
                  format: binary
                  description: Legacy image-only field (still accepted).
      responses:
        "200":
          description: Ranked candidate areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaIdentificationResult"
        "400":
          description: |-
            Bad request. Returned when no media file was attached. Known
            `code` values: `MEDIA_REQUIRED` (when emitted by clients that
            populate the structured envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /submissions/{id}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: Get a single submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submission detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /submissions/{id}/reupload:
    put:
      operationId: reuploadSubmission
      tags: [submissions]
      summary: Re-upload media for an existing submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                photo:
                  type: string
                  format: binary
                shift:
                  type: string
                  enum: [A, B, C]
                machineTag:
                  type: string
      responses:
        "200":
          description: Submission updated and re-scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: |-
            Bad request. Returned when the submission id can't be parsed or
            no media file was attached. Known `code` values: `INVALID_ID`,
            `MEDIA_REQUIRED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: |-
            The caller is not allowed to re-upload media for this
            submission (only the original operator can). Known `code`
            values: `FORBIDDEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: |-
            The requested submission does not exist. Known `code` values:
            `SUBMISSION_NOT_FOUND`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: |-
            The scoring pipeline failed during the re-score (e.g. AI scorer
            or media decoder errored). Known `code` values:
            `SCORING_FAILED`. `retryable` is set to `true` so callers can
            offer a retry without re-prompting the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/compliance:
    get:
      operationId: getDashboardCompliance
      tags: [dashboard]
      summary: Get shift compliance percentage
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: shift
          in: query
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Compliance data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceData"

  /dashboard/scores:
    get:
      operationId: getDashboardScores
      tags: [dashboard]
      summary: Get average scores by area/shift/day
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [area, shift, day]
      responses:
        "200":
          description: Score summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreSummary"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Quick overview stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/ai-reliability:
    get:
      operationId: getDashboardAiReliability
      tags: [dashboard]
      summary: AI scoring retry rate over recent windows
      responses:
        "200":
          description: Retry-rate stats for the AI scoring pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAiReliability"

  /dashboard/ai-cost:
    get:
      operationId: getDashboardAiCost
      tags: [dashboard]
      summary: Per-model AI latency, token usage, and estimated spend
      description: >-
        Per-`modelVersion` rollup of latency (avg + p95), token usage,
        and an estimated USD cost over rolling 7d and 30d windows. Lets
        managers see what the gpt-5 upgrade is costing in time and money,
        with old `gpt-5-mini-…` rows and the new `gpt-5-…` rows rendered
        side-by-side so the trade-off is obvious at a glance.
      responses:
        "200":
          description: Per-model cost/latency rollup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAiCost"

  /dashboard/trends:
    get:
      operationId: getDashboardTrends
      tags: [dashboard]
      summary: Per-area daily score trend over the last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 14
        - name: shift
          in: query
          description: Restrict each day's average to submissions from a single shift.
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Trend per area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaTrend"

  /dashboard/operator-dismisses:
    get:
      operationId: getDashboardOperatorDismisses
      tags: [dashboard]
      summary: Operators ranked by nudges they dismissed without re-capturing
      description: >-
        Aggregates nudges with dismissReason=OPERATOR_DISMISS over the last N
        days, grouped by the operator who silenced them. Helps managers spot
        operators who habitually swipe nudges away instead of submitting fresh
        evidence.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: One row per operator with at least one OPERATOR_DISMISS in the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorDismissSummary"

  /dashboard/operator-dismisses/detail:
    get:
      operationId: getDashboardOperatorDismissesDetail
      tags: [dashboard]
      summary: Drill-down list of an operator's dismissed-without-submit nudges
      parameters:
        - name: operatorId
          in: query
          required: true
          schema:
            type: integer
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
      responses:
        "200":
          description: Newest first list of nudges this operator silenced in the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorDismissedNudge"

  /dashboard/operator-coaching-nudge:
    post:
      operationId: sendOperatorCoachingNudge
      tags: [dashboard]
      summary: Manager fires a coaching nudge at an operator's most-dismissed area
      description: >-
        Closes the loop on the operator-dismiss panel: rather than only seeing
        which operators are silencing nudges, the manager taps a row to drop a
        fresh nudge on that operator's most-dismissed area in the configured
        last-N-days window. The nudge lands on the current shift with a
        manager-supplied (or default) message. Throttled per (operator, area)
        for one hour so a quick double-tap or two managers acting on the same
        row at once don't pile reminders on the operator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOperatorCoachingNudgeBody"
      responses:
        "201":
          description: Coaching nudge created (or returned the existing one if a still-active nudge for the same area+shift already covered the case).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCoachingNudgeResult"
        "404":
          description: Operator not found, or no OPERATOR_DISMISS history exists in the window — there is nothing to coach on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: A coaching nudge for this operator's most-dismissed area went out within the throttle window. The body carries the prior send time so the UI can show "Already reminded N min ago".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorCoachingNudgeThrottled"

  /dashboard/area-detection-agreement:
    get:
      operationId: getAreaDetectionAgreement
      tags: [dashboard]
      summary: How often the auto-detected area matched the area the operator originally tapped
      description: Aggregates agreement between `tappedAreaId` (intent) and `areaId` (chosen) over the requested window. Submissions with no recorded `tappedAreaId` (legacy rows) are excluded from the totals so the rate isn't diluted.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Agreement metrics overall, per area, and per operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaDetectionAgreement"

  /shift/current:
    get:
      operationId: getCurrentShift
      tags: [submissions]
      summary: Get the current shift based on server time
      responses:
        "200":
          description: Current shift info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentShift"

  /shift/config:
    get:
      operationId: getShiftConfig
      tags: [submissions]
      summary: Get the facility's configured shift timezone and start hours
      responses:
        "200":
          description: Shift timezone + start hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftConfig"

  /operator/status:
    get:
      operationId: getOperatorStatus
      tags: [submissions]
      summary: Get operator submission status for current shift
      parameters:
        - name: shift
          in: query
          required: false
          schema:
            type: string
            enum: [A, B, C]
      responses:
        "200":
          description: Status per area for current shift
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaStatus"

  /operator/next-checks:
    get:
      operationId: getNextChecks
      tags: [schedule]
      summary: Proactive feed of areas/machines that need to be checked next
      responses:
        "200":
          description: Ordered next-check list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NextCheck"

  /operator/recent:
    get:
      operationId: getOperatorRecent
      tags: [submissions]
      summary: Operator's most recent submissions across shifts (latest N within a 30-day context window)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Recent submissions for the current operator with prior-score context
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentSubmission"

  /escalations:
    get:
      operationId: listEscalations
      tags: [escalations]
      summary: List escalations (manager)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, ACKNOWLEDGED, RESOLVED, ALL]
        - name: sort
          in: query
          description: >-
            Sort order. `recent` (default) sorts by createdAt DESC. `mostReminded`
            sorts by repingCount DESC with createdAt DESC as a tiebreaker so the
            most-pinged escalations float to the top.
          schema:
            type: string
            enum: [recent, mostReminded]
            default: recent
        - name: minRepingCount
          in: query
          description: >-
            Inclusive lower bound on repingCount. Pass `1` to filter to escalations
            that have already been auto-reminded at least once ("needs attention").
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Escalations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Escalation"

  /escalations/count:
    get:
      operationId: getEscalationCount
      tags: [escalations]
      summary: Open escalation count for badges
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationCount"

  /escalations/{id}/acknowledge:
    post:
      operationId: acknowledgeEscalation
      tags: [escalations]
      summary: Manager acknowledges an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Escalation"

  /escalations/{id}/resolve:
    post:
      operationId: resolveEscalation
      tags: [escalations]
      summary: Manager resolves an escalation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
