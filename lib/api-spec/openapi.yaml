    AiReliabilityWindow:
      type: object
      description: Retry-rate stats for one rolling time window of AI scoring calls.
      properties:
        totalCalls:
          type: integer
          description: Number of VLM scoring calls completed inside this window.
        retriedCalls:
          type: integer
          description: How many of those required a second VLM call to produce valid JSON.
        retryRate:
          type: number
          description: retriedCalls / totalCalls, expressed as a 0-1 decimal. 0 when totalCalls is 0.
        topErrors:
          type: array
          description: |
            Top distinct validation error messages observed on retried calls in this window,
            sorted by count descending. Capped at the server's top-N. Helps engineers see which
            specific failures (e.g. "missing pillar_scores object") are driving the retry rate
            instead of inferring it from the headline percentage.
          items:
            $ref: "#/components/schemas/AiReliabilityErrorBreakdown"
      required: [totalCalls, retriedCalls, retryRate, topErrors]

    DashboardAiReliability:
      type: object
      description: |
        How reliably the AI scoring model is producing valid JSON on its first
        attempt. Lets managers/engineers spot at a glance whether the model
        is misbehaving today (e.g. 30% of audits silently retried, doubling
        the API spend) by comparing the rolling 24h window to the 7d baseline.
      properties:
        last24h:
          $ref: "#/components/schemas/AiReliabilityWindow"
        last7d:
          $ref: "#/components/schemas/AiReliabilityWindow"
      required: [last24h, last7d]

    AiCostModelRow:
      type: object
      description: |
        Aggregate latency + token usage for one (modelVersion, callKind) pair
        inside a rolling time window. callKind is "scoring" for rubric audits
        and "identification" for the area-detection pass; both share the same
        underlying ai_scoring_metrics table.
      properties:
        modelVersion:
          type: string
          description: The modelVersion string the pipeline tagged each row with (e.g. "gpt-5-factory-v1", "gpt-5-mini-warehouse-v3").
        callKind:
          type: string
          description: Which pipeline produced these calls — "scoring" (callVLM rubric pass) or "identification" (area auto-detect).
        requestCount:
          type: integer
          description: Number of model calls grouped into this row.
        avgLatencyMs:
          type: integer
          nullable: true
          description: Mean wall-clock duration in milliseconds. Null when no row in this group has a recorded latency.
        p95LatencyMs:
          type: integer
          nullable: true
          description: 95th percentile latency in milliseconds (PERCENTILE_CONT). Null when no row in this group has a recorded latency.
        totalPromptTokens:
          type: integer
          description: Sum of prompt_tokens across the grouped rows. 0 when no usage was reported by the proxy.
        totalCompletionTokens:
          type: integer
          description: Sum of completion_tokens across the grouped rows. 0 when no usage was reported.
        totalTokens:
          type: integer
          description: Sum of total_tokens across the grouped rows. 0 when no usage was reported.
        estimatedCostUsd:
          type: number
          nullable: true
          description: Rough USD spend for the window using the published gpt-5 family per-token pricing. Null when the modelVersion didn't map to a known pricing family.
        estimatedCostPerCallUsd:
          type: number
          nullable: true
          description: estimatedCostUsd / requestCount, rounded to 4 decimal places. Null when pricing was unknown.
        estimatedTokensPerCall:
          type: integer
          nullable: true
          description: Average tokens consumed per request (totalTokens / requestCount), rounded to a whole token. Null only in the unreachable requestCount==0 case.
      required:
        - modelVersion
        - callKind
        - requestCount
        - avgLatencyMs
        - p95LatencyMs
        - totalPromptTokens
        - totalCompletionTokens
        - totalTokens
        - estimatedCostUsd
        - estimatedCostPerCallUsd
        - estimatedTokensPerCall

    DashboardAiCost:
      type: object
      description: |
        Per-model latency, token usage, and rough USD cost over rolling 7d and
        30d windows. Lets managers see what swapping the underlying model is
        costing in time and money, with old gpt-5-mini-… rows and the new
        gpt-5-… rows rendered side-by-side so the trade-off is obvious.
      properties:
        last7d:
          type: array
          items:
            $ref: "#/components/schemas/AiCostModelRow"
        last30d:
          type: array
          items:
            $ref: "#/components/schemas/AiCostModelRow"
      required: [last7d, last30d]

