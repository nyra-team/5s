    KeyframeMetrics:
      type: object
      description: Per-step timings and frame counts produced by the keyframe pipeline for a single video submission. Mirrors the `KeyframeMetrics` interface in the AI scoring lib. Surfaced in the manager audit detail view so a manager can see how long ffmpeg vs. dedup vs. compression each took, and how many frames were dropped as duplicates vs. dropped to respect the candidate cap.
      properties:
        candidatesProduced:
          type: integer
          description: Total raw frames produced by ffmpeg across the scene-detect pass and (if needed) the fallback fixed-interval pass, before dedup runs.
        candidatesKept:
          type: integer
          description: Number of frames that survived dedup and were sent to the VLM.
        droppedDuplicate:
          type: integer
          description: Frames discarded by the perceptual-hash dedup pass as visually-identical to an already-kept frame.
        droppedOverCap:
          type: integer
          description: Remaining unique candidates discarded after `maxFrames` slots had already been filled.
        usedFallback:
          type: boolean
          description: True iff scene detection found nothing and the fixed-interval fallback pass had to run.
        totalMs:
          type: integer
          description: Wall-clock time for the full keyframe pipeline (scene detect + optional fallback + dedup + compress), in milliseconds.
        sceneDetectMs:
          type: integer
          description: Time spent in the scene-change ffmpeg pass, in milliseconds.
        fallbackSampleMs:
          type: integer
          nullable: true
          description: Time spent in the fixed-interval ffmpeg fallback pass, in milliseconds. Only present when scene detection produced nothing.
        dedupMs:
          type: integer
          description: Time spent computing perceptual hashes and picking unique survivors, in milliseconds.
        compressMs:
          type: integer
          description: Time spent downscaling and re-encoding survivors for the VLM payload, in milliseconds.
      required:
        - candidatesProduced
        - candidatesKept
        - droppedDuplicate
        - droppedOverCap
        - usedFallback
        - totalMs
        - sceneDetectMs
        - dedupMs
        - compressMs

