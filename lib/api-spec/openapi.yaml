            schema:
              $ref: "#/components/schemas/UpdateOperatorThresholdsBody"
      responses:
        "200":
          description: Effective thresholds after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorThresholds"

  /operator-thresholds/areas/{id}:
    get:
      operationId: getAreaOperatorThresholds
      tags: [settings]
      summary: Get the effective per-area operator thresholds (env > area-DB > global-DB > default)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Effective thresholds for the area + per-layer overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaOperatorThresholds"
