        - lowScoring
        - openEscalations

    BackfillReasoningStatus:
      type: object
      properties:
        remaining:
          type: integer
          description: Submissions still missing aiReasoningJson
      required: [remaining]

    BackfillReasoningRowResult:
      type: object
      properties:
        submissionId:
          type: integer
        status:
          type: string
          enum: [updated, missing_media, scoring_failed, would_update]
        reason:
          type: string
      required: [submissionId, status]

    BackfillReasoningResult:
      type: object
      properties:
        scanned:
          type: integer
        updated:
          type: integer
        missingMedia:
          type: integer
        scoringFailed:
          type: integer
